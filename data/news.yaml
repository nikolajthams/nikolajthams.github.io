- date: 2022-03-14
  title: New Paper on Instrumental Time Series
  text: |
    New paper __*Identifying Causal Effects using Instrumental Time Series: Nuisance IV and Correcting for the Past*__ online now! In this paper, we provide a structured treatment of instrumental variable (IV) methods in time series data, by showing that valid IV models can be identified by representing the time series as a finite graph. We emphasize the need for adjusting for past states of the time series, to get valid instruments, and develop _Nuisance IV_, a modification of IV estimators. [[PDF]](https://arxiv.org/pdf/2203.06056.pdf) [[Code]](https://github.com/nikolajthams/its-time)
  pinned: false

- date: 2022-02-01
  title: Invariant Ancestry Search
  text: |
    In our new paper __*Invariant Ancestry Search*__, we learn causal ancestors by using heterogeneity in data. We test sets for minimally invariance, and show that the union of minimaly invariant sets is ancestral. Our method retains level guarantees also when dimensionality is too large to exhaustively search all sets, and we apply our method in a genetic dataset with 6000 genes. [[PDF]](https://arxiv.org/pdf/2202.00913.pdf)[[CODE]](https://github.com/PhillipMogensen/InvariantAncestrySearch)
  pinned: false

- date: 2021-10-26
  title: Local Independence Testing in Point Processes
  text: |
    In our new work, __*Local Independence Testing in Point Processes*__, we develop methods for learning causal structure in complex event data, such as firing of neurons in the brain. [[PDF]](https://arxiv.org/pdf/2110.12709.pdf)[[CODE]](https://github.com/nikolajthams/LIPP)
  pinned: false

- date: 2021-05-24
  title: Statistical Testing under Distributional Shifts
  text: |
    What do you do if you observe data from a distribution `Q` but want to test a hypothesis about a different, but related, distribution `P`? In our recent paper, __*Statistical Testing under Distributional Shifts*__, we show how to test hypotheses in `P` by applying a test in a auxiliary dataset drawn by weighted resampling. [[PDF]](https://arxiv.org/pdf/2105.10821.pdf)
  pinned: false

- date: 2020-03-03
  title: Causal Structure Learning from Time Series
  text: |
    Are p-values better better for detecting causal links than raw regression coefficients? Not always, we demonstrate in the paper __*Causal Structure Learning from Time Series*__, which is now on arXiv. [[PDF]](http://proceedings.mlr.press/v123/weichwald20a/weichwald20a.pdf)
  pinned: false

