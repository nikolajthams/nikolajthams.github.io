<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - Nikolaj Thams</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <main class="container">

        <div class="news-timeline" id="news-timeline">
            <div class="news-item">
                <div class="news-content-large">
                    <p>Loading news...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/newsparser.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Load all news on news page
        document.addEventListener('DOMContentLoaded', async () => {
            const newsTimeline = document.getElementById('news-timeline');
            if (newsTimeline) {
                try {
                    const allNews = await loadNewsFromYAML();
                    newsTimeline.innerHTML = renderNewsTimeline(allNews);
                } catch (error) {
                    console.error('Error loading news:', error);
                    newsTimeline.innerHTML = '<div class="news-item"><div class="news-content-large"><p>Error loading news.</p></div></div>';
                }
            }
        });
    </script>
</body>
</html>
